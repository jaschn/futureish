[pytest]
addopts = ["-n", "auto", "--import-mode=importlib", "-m not slow", "-p no:dash"]
filterwarnings = [
    "error",
    "ignore:distutils Version classes are deprecated:DeprecationWarning",
    "ignore:`torch.jit.script` is deprecated. Please switch to `torch.compile` or `torch.export`:DeprecationWarning",
    "ignore:`torch.jit.script` is deprecated. Please switch to `torch.compile` or `torch.export`:FutureWarning",
    "ignore:TRITON_DEFAULT_FP_FUSION is unset:UserWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]