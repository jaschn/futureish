[project]
name = "futureish"
version = "0.1.2"
description = "Uncertainty aware time series library with online update/training support."
readme = "README.md"
authors = [
    { name = "Jakob Schneider", email = "git@jaschn.de" }
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["time-series", "forecasting", "gaussian-process", "probabilistic", "online-learning", "uncertainty", "gpytorch", "catboost"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]


requires-python = ">=3.11"
dependencies = [
    "catboost>=1.2",
    "numpy>=1.24",
    "polars>=2.0.0",
    "tqdm>=4.30.0",
    "gpytorch>=1.12.0",
    "torch>=2.3.0",
    "linear-operator>=0.6.1",
]

[project.urls]
Homepage = "https://github.com/jaschn/futureish"
Repository = "https://github.com/jaschn/futureish"
Issues = "https://github.com/jaschn/futureish/issues"
Changelog = "https://github.com/jaschn/futureish/releases"

[build-system]
requires = ["uv_build>=0.11.21,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
required-environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'",
    "sys_platform == 'win32'",
]
constraint-dependencies = [
    "catboost>=1.2.10 ; python_full_version >= '3.12'",
    "numpy>=1.26.0 ; python_full_version >= '3.12' and python_full_version < '3.13'",
    "numpy>=2.1.0 ; python_full_version >= '3.13' and python_full_version < '3.14'",
    "numpy>=2.3.3 ; python_full_version >= '3.14'",
    "pandas>=2.2.0 ; python_full_version >= '3.12' and python_full_version < '3.13'",
    "pandas>=2.2.3 ; python_full_version >= '3.13' and python_full_version < '3.14'",
    "pandas>=2.3.3 ; python_full_version >= '3.14'",
]

[dependency-groups]
examples = [
    "ipykernel>=7.3.0",
    "pip>=26.1.2",
    "matplotlib>=3.11.0",
]

test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
]

[tool.pyright]
reportUnusedImport = false

[[tool.pyright.executionEnvironments]]
root = "."
extraPaths = [
    "src",
]
