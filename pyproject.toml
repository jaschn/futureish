[project]
name = "futureish"
version = "0.1.2"
description = "Uncertainty aware time series library with online update/training support."
readme = "README.md"
authors = [
    { name = "Jakob Schneider", email = "git@jaschn.de" }
]
license-files = ["LICENSE"]

requires-python = ">=3.11"
dependencies = [
    "catboost>=1.2.10",
    "numpy>=2.4.6",
    "polars>=2.1.0",
    "tqdm>=4.70.1",
    "gpytorch>=1.15.2",
    "linear-operator",
    "torch>=2.14.1",
]

environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'",
    "sys_platform == 'win32'",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
required-environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'",
    "sys_platform == 'win32'",
]

default-groups = [

]

[dependency-groups]
examples = [
    "ipykernel>=7.3.0",
    "pip>=26.1.2",
    "matplotlib>=3.11.0",
]

test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
]

[tool.pyright]
reportUnusedImport = false

[[tool.pyright.executionEnvironments]]
root = "."
extraPaths = [
    "src",
]
