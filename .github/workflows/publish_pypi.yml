name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  pypi-publish:
    if: startsWith(github.ref, 'refs/tags/v')
    name: upload release to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify tag belongs to main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --locked --group test

      - name: Run tests
        run: uv run pytest -n auto --import-mode=importlib -m "not slow" -p "no:dash"

      - name: Verify release tag
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$tag_version" = "$package_version"

      - name: Build package distributions
        run: uv build

      - name: Check package metadata
        run: uvx twine check --strict dist/*

      - name: Verify wheel installs and imports
        run: |
          uv venv --python 3.11 "$RUNNER_TEMP/venv-wheel"
          uv pip install --python "$RUNNER_TEMP/venv-wheel/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv-wheel/bin/python" - <<'EOF'
          import importlib.metadata as md
          import os

          import futureish
          import futureish.datapoints, futureish.features, futureish.scaling
          import futureish.datasets, futureish.gpr, futureish.forecasting

          expected = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          installed = md.version("futureish")
          assert installed == expected, f"installed {installed}, expected {expected}"
          print("wheel OK:", installed)
          EOF

      - name: Verify sdist installs and imports
        run: |
          uv venv --python 3.11 "$RUNNER_TEMP/venv-sdist"
          uv pip install --python "$RUNNER_TEMP/venv-sdist/bin/python" dist/*.tar.gz
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv-sdist/bin/python" -c "import futureish.forecasting, futureish.gpr; print('sdist OK')"

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Release ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag