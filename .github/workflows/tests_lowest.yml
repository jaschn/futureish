name: Tests

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "pytest.toml"
      - ".github/workflows/tests.yml"
      - ".github/workflows/tests_lowest.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "pytest.toml"
      - ".github/workflows/tests.yml"
      - ".github/workflows/tests_lowest.yml"

permissions:
  contents: read

jobs:
  test:
    name: Run test suite with lowest dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --group test --resolution lowest-direct

      - name: Show resolved versions
        run: uv pip list

      - name: Run tests
        run: uv run --no-sync pytest -x -n auto --import-mode=importlib -m "not slow" -p "no:dash"
